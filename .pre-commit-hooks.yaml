-   id: understanding-agent
    name: Code Understanding Check
    description: Prompts developer to explain code changes.
    entry: understanding-agent
    language: python
    pass_filenames: false
    stages: [pre-commit, prepare-commit-msg]

-   id: understanding-agentHook
    name: Code Understanding Check (alias)
    description: Prompts developer to explain code changes.
    entry: understanding-agent
    language: python
    pass_filenames: false
    stages: [pre-commit, prepare-commit-msg]

-   id: understanding-agent-push-guard
    name: Understanding Install Guard (pre-push)
    description: Verifies the understanding pre-commit hook is installed before a push.
    entry: understanding-agent-push-guard
    language: python
    pass_filenames: false
    stages: [pre-push]

