[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "understanding-agent"
version = "0.4.0"
description = "AI-powered code understanding oral-defense pre-commit hook: verifies developers understand the code they commit."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Liza Satasiya" }]
dependencies = []

[project.optional-dependencies]
voice = ["sounddevice", "openai-whisper", "numpy"]
ui = ["fastapi", "uvicorn", "pydantic>=2"]

[project.scripts]
understanding-agent = "understanding_agent.applause:main"
understanding-agent-ui = "understanding_agent.monster_ball:run"

[tool.setuptools]
packages = ["understanding_agent"]

[tool.setuptools.package-data]
understanding_agent = ["ui/*"]
